{% extends 'base.html' %}

{% block title %}
  Edit Comment
{% endblock %}

{% block content %}
  <div class="container">
    <h1>Edit Comment</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.content }}
      {% if form.content.errors %}
        <div class="text-danger">{{ form.content.errors }}</div>
      {% endif %}
      <div class="mt-3">
        <a href="{{ comment.post.get_absolute_url }}">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
{% endblock %}
